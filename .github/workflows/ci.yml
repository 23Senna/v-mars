name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Qt runtime libraries
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon-x11-0 libdbus-1-3
      - name: Install
        run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check .
      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pytest -q -rfE --tb=short 2>&1 | tee pytest.log || {
            # Surface failures as annotations so they are visible without opening the log.
            grep -E "^(FAILED|ERROR) |Error:|Exception" pytest.log | head -20 | sed 's/^/::error::/'
            exit 1
          }
